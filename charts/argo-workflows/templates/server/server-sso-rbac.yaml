{{- if and .Values.server.enabled .Values.server.sso.enabled .Values.server.sso.rbac.enabled -}}
{{- $fullName := include "argo-workflows.fullname" . -}}
{{- $namespace := include "argo-workflows.namespace" . -}}
{{- $adminGroup := .Values.server.sso.rbac.groups.admin -}}
{{- $userGroup := .Values.server.sso.rbac.groups.user -}}
---
# ClusterRole for SSO admin users — full access to all Argo resources across all namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullName }}-sso-admin
  labels:
    {{- include "argo-workflows.labels" (dict "context" . "component" .Values.server.name "name" .Values.server.name) | nindent 4 }}
rules:
- apiGroups:
  - argoproj.io
  resources:
  - workflows
  - workflows/finalizers
  - workfloweventbindings
  - workfloweventbindings/finalizers
  - workflowtemplates
  - workflowtemplates/finalizers
  - cronworkflows
  - cronworkflows/finalizers
  - clusterworkflowtemplates
  - clusterworkflowtemplates/finalizers
  - workflowtasksets
  - workflowtasksets/finalizers
  - workflowtaskresults
  - workflowtaskresults/finalizers
  - workflowartifactgctasks
  - workflowartifactgctasks/finalizers
  - eventsources
  - sensors
  verbs:
  - create
  - delete
  - deletecollection
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - pods
  - pods/log
  - events
  - configmaps
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - delete
---
# ClusterRole for SSO standard users — read-only access to all Argo resources across all namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullName }}-sso-user
  labels:
    {{- include "argo-workflows.labels" (dict "context" . "component" .Values.server.name "name" .Values.server.name) | nindent 4 }}
rules:
- apiGroups:
  - argoproj.io
  resources:
  - workflows
  - workflows/finalizers
  - workfloweventbindings
  - workfloweventbindings/finalizers
  - workflowtemplates
  - workflowtemplates/finalizers
  - cronworkflows
  - cronworkflows/finalizers
  - clusterworkflowtemplates
  - clusterworkflowtemplates/finalizers
  - workflowtasksets
  - workflowtasksets/finalizers
  - workflowtaskresults
  - workflowtaskresults/finalizers
  - workflowartifactgctasks
  - workflowartifactgctasks/finalizers
  - eventsources
  - sensors
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - pods
  - pods/log
  - events
  - configmaps
  verbs:
  - get
  - list
  - watch
---
# ServiceAccount for SSO admin users.
# Mapped to Cognito group: {{ $adminGroup }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argo-workflows-admin
  namespace: {{ $namespace | quote }}
  labels:
    {{- include "argo-workflows.labels" (dict "context" . "component" .Values.server.name "name" .Values.server.name) | nindent 4 }}
  annotations:
    workflows.argoproj.io/rbac-rule: "'{{ $adminGroup }}' in groups"
    workflows.argoproj.io/rbac-rule-precedence: "1"
---
# Long-lived token secret for argo-workflows-admin.
# Required for Argo Server to impersonate this SA on behalf of SSO users.
# Kubernetes 1.24+ no longer auto-creates SA tokens — this must be explicit.
# Discovery by name: Argo looks for a secret named {sa}.service-account-token
apiVersion: v1
kind: Secret
metadata:
  name: argo-workflows-admin.service-account-token
  namespace: {{ $namespace | quote }}
  labels:
    {{- include "argo-workflows.labels" (dict "context" . "component" .Values.server.name "name" .Values.server.name) | nindent 4 }}
  annotations:
    kubernetes.io/service-account.name: argo-workflows-admin
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullName }}-sso-admin
  labels:
    {{- include "argo-workflows.labels" (dict "context" . "component" .Values.server.name "name" .Values.server.name) | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $fullName }}-sso-admin
subjects:
  - kind: ServiceAccount
    name: argo-workflows-admin
    namespace: {{ $namespace | quote }}
---
# ServiceAccount for SSO standard users.
# Mapped to Cognito group: {{ $userGroup }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argo-workflows-user
  namespace: {{ $namespace | quote }}
  labels:
    {{- include "argo-workflows.labels" (dict "context" . "component" .Values.server.name "name" .Values.server.name) | nindent 4 }}
  annotations:
    workflows.argoproj.io/rbac-rule: "'{{ $userGroup }}' in groups"
    workflows.argoproj.io/rbac-rule-precedence: "2"
---
# Long-lived token secret for argo-workflows-user.
# Same requirement as above — must be explicit on Kubernetes 1.24+.
apiVersion: v1
kind: Secret
metadata:
  name: argo-workflows-user.service-account-token
  namespace: {{ $namespace | quote }}
  labels:
    {{- include "argo-workflows.labels" (dict "context" . "component" .Values.server.name "name" .Values.server.name) | nindent 4 }}
  annotations:
    kubernetes.io/service-account.name: argo-workflows-user
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullName }}-sso-user
  labels:
    {{- include "argo-workflows.labels" (dict "context" . "component" .Values.server.name "name" .Values.server.name) | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $fullName }}-sso-user
subjects:
  - kind: ServiceAccount
    name: argo-workflows-user
    namespace: {{ $namespace | quote }}
{{- end }}
